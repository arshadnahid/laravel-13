  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List suppliers

  `GET /api/suppliers` (requires Bearer token; run **Auth > login** first)

  Paginated, newest first. Soft-deleted suppliers are excluded unless `trashed` is set. All filters are optional, are "contains" matches (case-insensitive per DB collation) and combine with AND. Disable a query param in the Params tab to skip that filter.

  ## Query params

  | Param | Type | Rules |
  |---|---|---|
  | name | string | optional, max 255 |
  | email | string | optional, max 255 |
  | phone_number | string | optional, max 20 |
  | address | string | optional, max 255 |
  | trashed | string | optional, `only` = soft-deleted suppliers only, `with` = active and soft-deleted, omitted = active only |
  | per_page | integer | optional, 1-100, default 15 |
  | page | integer | optional, min 1, default 1 |

  ## 200 OK

  ```json
  {
    "data": [
      {
        "id": "01k6x...",
        "name": "Acme Trading Ltd",
        "slug": "acme-trading-ltd",
        "email": "contact@acme-trading.com",
        "phone_number": "+8801700000000",
        "description": "Wholesale electronics supplier",
        "address": "House 12, Road 5, Dhanmondi, Dhaka",
        "website": "https://acme-trading.com",
        "logo_url": "https://acme-trading.com/logo.png",
        "created_at": "2026-10-07T10:00:00.000000Z",
        "updated_at": "2026-10-07T10:00:00.000000Z"
      }
    ],
    "message": "Suppliers retrieved successfully",
    "errors": [],
    "success": true,
    "status": "success",
    "pagination": {
      "current_page": 1,
      "per_page": 10,
      "total": 1,
      "last_page": 1,
      "from": 1,
      "to": 1,
      "next_page_url": null,
      "prev_page_url": null
    }
  }
  ```

  ## Errors

  | Status | When |
  |---|---|
  | 401 | Missing or invalid token |
  | 404 | No suppliers match the filters (empty page); `data` is `[]` and `pagination` is still returned |
  | 422 | Invalid query param, e.g. `per_page=500` (field messages in `errors`) |
