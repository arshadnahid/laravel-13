http:
  method: GET
  url: "{{baseUrl}}api/suppliers/01k6x0000000000000000000000"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

docs: |-
  # Show supplier

  `GET /api/suppliers/{id}` (requires Bearer token; run **Auth > login** first)

  Replace the sample ULID in the URL with a real supplier `id` (from **list** or **create**). Soft-deleted suppliers return 404.

  ## 200 OK

  ```json
  {
    "data": {
      "id": "01k6x...",
      "name": "Acme Trading Ltd",
      "slug": "acme-trading-ltd",
      "email": "contact@acme-trading.com",
      "phone_number": "+8801700000000",
      "description": "Wholesale electronics supplier",
      "address": "House 12, Road 5, Dhanmondi, Dhaka",
      "website": "https://acme-trading.com",
      "logo_url": "https://acme-trading.com/logo.png",
      "created_at": "2026-10-07T10:00:00.000000Z",
      "updated_at": "2026-10-07T10:00:00.000000Z"
    },
    "message": "Supplier retrieved successfully",
    "errors": [],
    "success": true,
    "status": "success"
  }
  ```

  ## Errors

  | Status | When |
  |---|---|
  | 401 | Missing or invalid token |
  | 404 | Supplier not found or soft-deleted |

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
