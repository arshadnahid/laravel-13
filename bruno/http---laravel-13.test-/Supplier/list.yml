http:
  method: GET
  url: "{{baseUrl}}api/suppliers?per_page=15&page=1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: name
      value: acme
      type: query
      disabled: true
    - name: email
      value: "@acme-trading.com"
      type: query
      disabled: true
    - name: phone_number
      value: "+88017"
      type: query
      disabled: true
    - name: address
      value: dhaka
      type: query
      disabled: true
    - name: trashed
      value: only
      type: query
      disabled: true
